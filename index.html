<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sách giáo khoa và Bộ truyền dẫn kiến thức</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      text-align: center;
    }

    header {
      padding: 20px 16px 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    #page-info {
      margin-top: 8px;
      opacity: 0.75;
    }

    main {
      width: min(900px, 100%);
      margin: auto;
      padding: 10px 16px 40px;
    }

    #page-image {
      display: block;
      width: min(100%, 700px);
      height: auto;
      margin: 10px auto 20px;
      border-radius: 10px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      min-width: 150px;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #audio-container {
      width: min(700px, 100%);
      margin: 20px auto;
    }

    #audio-player {
      width: 100%;
      height: 54px;
    }

    #audio-link {
      display: inline-block;
      margin-top: 10px;
      color: #8ecaff;
    }

    #loading {
      padding: 40px;
      opacity: 0.7;
    }

    #error {
      color: #ff8a8a;
      margin: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1 id="book-title">Đang tải sách...</h1>
  <div id="page-info"></div>
</header>

<main>

  <div id="loading">
    Đang tải nội dung...
  </div>

  <div id="error"></div>

  <div class="controls">

    <button id="prev">
      ← Trang trước
    </button>

    <button id="next">
      Trang sau →
    </button>

  </div>

  <img
    id="page-image"
    alt=""
    style="display:none;"
  >

  <div
    id="audio-container"
    style="display:none;"
  >

    <audio
      id="audio-player"
      controls
      preload="none"
    ></audio>

    <div>
      <a
        id="audio-link"
        target="_blank"
        rel="noopener"
      >
        Mở bản thu âm trên Vocaroo
      </a>
    </div>

  </div>

</main>

<script>

const BOOK_URL =
  "public/data/book.json";

const VOCAROO_URL =
  "adapters/Vocaroo/vocaroo-manifest.json";

let book = null;
let vocaroo = null;

/*
 * currentPage:
 *
 * -1 = cover
 *  0 = page-01
 *  1 = page-02
 * ...
 */

let currentPage = -1;


/* ============================================================
 * DOM
 * ============================================================
 */

const titleEl =
  document.getElementById("book-title");

const infoEl =
  document.getElementById("page-info");

const imageEl =
  document.getElementById("page-image");

const loadingEl =
  document.getElementById("loading");

const errorEl =
  document.getElementById("error");

const prevEl =
  document.getElementById("prev");

const nextEl =
  document.getElementById("next");

const audioContainerEl =
  document.getElementById("audio-container");

const audioPlayerEl =
  document.getElementById("audio-player");

const audioLinkEl =
  document.getElementById("audio-link");


/* ============================================================
 * LOAD
 * ============================================================
 */

async function loadBook() {

  try {

    const [
      bookResponse,
      vocarooResponse
    ] = await Promise.all([

      fetch(BOOK_URL),

      fetch(VOCAROO_URL)

    ]);


    if (!bookResponse.ok) {

      throw new Error(
        "Không thể tải Book Data."
      );

    }


    if (!vocarooResponse.ok) {

      throw new Error(
        "Không thể tải Vocaroo manifest."
      );

    }


    book =
      await bookResponse.json();

    vocaroo =
      await vocarooResponse.json();


    titleEl.textContent =
      book.title;


    loadingEl.style.display =
      "none";


    showCover();

  }

  catch (error) {

    loadingEl.style.display =
      "none";

    errorEl.textContent =
      "Không thể tải sách: " +
      error.message;

    console.error(error);

  }

}


/* ============================================================
 * VOCAROO URL
 * ============================================================
 */

function getVocarooEmbedUrl(url) {

  if (!url) {
    return null;
  }


  /*
   * Voca.ro short URL:
   *
   * https://voca.ro/XXXXXXXX
   *
   * → Vocaroo embed:
   *
   * https://vocaroo.com/embed/XXXXXXXX
   */

  const match =
    url.match(
      /^https?:\/\/voca\.ro\/([^/?#]+)/
    );


  if (match) {

    return (
      "https://vocaroo.com/embed/" +
      match[1]
    );

  }


  /*
   * Already an embed URL.
   */

  if (
    url.includes(
      "vocaroo.com/embed/"
    )
  ) {

    return url;

  }


  return url;

}


/* ============================================================
 * FIND NARRATION
 * ============================================================
 */

function findNarration(narrationId) {

  if (!vocaroo) {
    return null;
  }

  if (
    vocaroo.narrations &&
    typeof vocaroo.narrations === "object"
  ) {

    return (
      vocaroo.narrations[narrationId] ||
      null
    );

  }

  return null;

}

/* ============================================================
 * CLEAR AUDIO
 * ============================================================
 */

function clearAudio() {

  audioContainerEl.style.display =
    "none";

  audioPlayerEl.pause();

  audioPlayerEl.removeAttribute(
    "src"
  );

  audioPlayerEl.load();

  audioLinkEl.removeAttribute(
    "href"
  );

}

/* ============================================================
 * SHOW COVER
 * ============================================================
 */

function showCover() {

  currentPage = -1;


  imageEl.src =
    "public/images/" +
    book.cover.image;

  imageEl.alt =
    book.title;

  imageEl.style.display =
    "block";


  infoEl.textContent =
    "Bìa sách";


  clearAudio();


  updateButtons();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ============================================================
 * SHOW PAGE
 * ============================================================
 */

function showPage(index) {

  if (
    !book ||
    !Array.isArray(book.pages)
  ) {

    return;

  }


  if (
    index < 0 ||
    index >= book.pages.length
  ) {

    return;

  }


  currentPage = index;


  const page =
    book.pages[index];


  imageEl.src =
    "public/images/" +
    page.image;

  imageEl.alt =
    "Trang " +
    (index + 1);


  infoEl.textContent =
    "Trang " +
    (index + 1) +
    " / " +
    book.pages.length;


  clearAudio();


  const narration =
    findNarration(
      page.narration_id
    );


  if (
    narration &&
    narration.embed_url
  ) {

    const match =
      narration.embed_url.match(
        /^https?:\/\/voca\.ro\/([^/?#]+)/
      );


    if (match) {

      const audioId =
        match[1];

      const directAudioUrl =
        "https://media.vocaroo.com/mp3/" +
        audioId;

      audioPlayerEl.src =
        directAudioUrl;

      audioContainerEl.style.display =
        "block";

      audioLinkEl.href =
        narration.embed_url;

    }

  }


  updateButtons();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ============================================================
 * BUTTON STATE
 * ============================================================
 */

function updateButtons() {

  /*
   * Cover:
   *
   * Previous disabled
   * Next enabled
   */

  if (currentPage === -1) {

    prevEl.disabled =
      true;

    nextEl.disabled =
      book.pages.length === 0;

    return;

  }


  /*
   * First page:
   *
   * Previous goes back to cover.
   */

  prevEl.disabled =
    false;


  /*
   * Last page:
   *
   * Next disabled.
   */

  nextEl.disabled =
    currentPage >=
    book.pages.length - 1;

}


/* ============================================================
 * PREVIOUS
 * ============================================================
 */

prevEl.addEventListener(
  "click",
  function () {

    if (currentPage === -1) {

      return;

    }


    if (currentPage === 0) {

      showCover();

      return;

    }


    showPage(
      currentPage - 1
    );

  }
);


/* ============================================================
 * NEXT
 * ============================================================
 */

nextEl.addEventListener(
  "click",
  function () {

    if (currentPage === -1) {

      showPage(0);

      return;

    }


    if (
      currentPage <
      book.pages.length - 1
    ) {

      showPage(
        currentPage + 1
      );

    }

  }
);


/* ============================================================
 * START
 * ============================================================
 */

loadBook();

</script>

</body>
</html>
